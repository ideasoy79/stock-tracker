<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'">
<style>
:root{--p:#7132F5;--p2:#5741D8;--pt:#ECE5FE;--ink:#101114;--ink2:#2E3040;--g7:#484B5E;--g6:#686B82;--g5:#9497A9;--g4:#B4B6C4;--g3:#CFD0DA;--line:#DEDEE5;--s2:#F0F0F4;--s1:#F6F7F8;
--up:#F04452;--dn:#3182F6;--ok:#149E61;--okt:#D9F0E6;--okd:#026B3F;--warn:#FB8800;--warnt:#FFF4E5;--warnd:#8A5300;--sh:0 4px 24px rgba(0,0,0,.03)}
*{box-sizing:border-box}

.wrap{max-width:480px;margin:0 auto;padding:0 16px calc(112px + env(safe-area-inset-bottom))}

.btn:active{background:var(--p2)}

.q-주도{background:#FDECEE;color:#C5283A}.q-부상{background:var(--warnt);color:var(--warnd)}.q-과열·눌림{background:var(--s2);color:var(--g7)}.q-소외{background:#EAF1FE;color:#1F5FD6}
.ck{width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box}

.hs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}

.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));width:calc(100% - 32px);max-width:448px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.06);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px 4px;z-index:20}

.sheet{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:480px;max-height:86vh;overflow:auto;padding:20px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(0,0,0,.06)}
.sheet h3{margin:0 0 8px;font-size:18px;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;font-size:14px;font-weight:500;padding:12px 16px;border-radius:12px;z-index:50;max-width:calc(100% - 32px);text-align:center}
textarea,input[type=text]{width:100%;border:1px solid var(--line);background:var(--s1);border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;color:var(--ink);resize:vertical}
textarea:focus,input:focus{outline:none;border-color:var(--p);background:#fff}
pre.pv{white-space:pre-wrap;word-break:break-word;font:inherit;font-size:13px;line-height:1.6;color:var(--ink2);margin:0;max-height:260px;overflow:auto}
.mapbox{position:relative;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:12px;background:#fff}
.mapbox svg{display:block}
.heat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.heat button{border:0;border-radius:8px;padding:10px 8px;min-height:64px;text-align:left;display:flex;flex-direction:column;justify-content:space-between}
.tl{display:flex;gap:10px;padding:0 0 12px}
.cand{position:relative;height:180px}
.warnbox{background:var(--warnt);color:var(--warnd);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5}
.ctr{display:grid;grid-template-columns:minmax(0,1fr) 64px 64px 56px;gap:6px;align-items:center;padding:11px 20px;border-top:1px solid var(--s2);font-size:13px}
.ctr.h{font-size:12px;color:var(--g6);border-top:0;border-bottom:1px solid var(--line);padding:6px 20px}
.ctr>span:not(:first-child){text-align:right}
@media (min-width:600px){.wrap{padding-top:12px}}

<body>
<div class="wrap" id="app"><div class="empty" style="padding-top:120px">불러오는 중이에요</div></div>
<nav class="tabs" id="tabs" aria-label="하단 탭"></nav>
<div id="layer"></div>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════
   생각콩 트래커 v2
   · 저녁 스캔(../scan/latest.json)을 직접 읽고, 기존 화면(v1)이 이 기기에 저장한 내 기록을 함께 읽어요
   · 쓰는 곳은 세 군데뿐: 오늘 제안 패스(sv4_app.dec) · 관심 종목(sv4_app.fav) · Claude 브리핑 기록(sv4_app.claude)
   · 주문 기능은 없어요. 시세 서버 주소는 기존 화면 설정값(sv4_scan_cfg.worker)을 그대로 써요
   ═══════════════════════════════════════════════════════════ */
const SCAN_URL='scan/latest.json', LIST_URL='scan/watchlist.json', THEMES_URL='scan/themes.json', V1='./';
const VER_N=20;
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=(n,d=1)=>n==null||isNaN(n)?'—':(n>0?'+':'')+Number(n).toFixed(d)+'%';
const won=n=>Math.round(n||0).toLocaleString('ko-KR')+'원';
const eok=n=>n==null?'—':(n>0?'+':'')+Math.round(n).toLocaleString('ko-KR')+'억';
const md=d=>d?String(d).slice(5).replace('-','/'):'';
const cls=n=>n>0?'up':n<0?'dn':'';
const pad=n=>String(n).padStart(2,'0');
const isoL=x=>x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());
function kst(){const n=new Date(Date.now()+9*3600e3);return {iso:n.getUTCFullYear()+'-'+pad(n.getUTCMonth()+1)+'-'+pad(n.getUTCDate()),min:n.getUTCHours()*60+n.getUTCMinutes(),dow:n.getUTCDay(),m:n.getUTCMonth()+1,d:n.getUTCDate(),y:n.getUTCFullYear()};}
const WD=['일','월','화','수','목','금','토'];
const dObj=s=>new Date(s+'T00:00:00');
function dLabel(s){const x=dObj(s);return (x.getMonth()+1)+'월 '+x.getDate()+'일 '+WD[x.getDay()]+'요일';}

/* 거래일 (주말·휴장일 제외) — 기존 화면과 같은 표 */
const KRX_HOLI=new Set(['2026-10-09','2026-12-25','2026-12-31','2027-01-01','2027-02-08','2027-02-09','2027-03-01','2027-05-05','2027-05-13','2027-08-16','2027-09-14','2027-09-15','2027-09-16','2027-10-04','2027-10-11','2027-12-27','2027-12-31']);
const isTD=x=>{const w=x.getDay();return w!==0&&w!==6&&!KRX_HOLI.has(isoL(x));};
function tdBetween(a,b){if(!a||!b||b<=a)return 0;let k=0;const x=dObj(a);while(isoL(x)<b){x.setDate(x.getDate()+1);if(isTD(x)&&isoL(x)<=b)k++;}return k;}
function nextTD(d,n){const x=dObj(d);let k=0;while(k<n){x.setDate(x.getDate()+1);if(isTD(x))k++;}return isoL(x);}
function prevTD(d,n){const x=dObj(d);let k=0;while(k<n){x.setDate(x.getDate()-1);if(isTD(x))k++;}return isoL(x);}

/* ── 데이터 ── */
let D=null, LOAD_ERR='', WL=null;
const cfg=()=>LS.get('sv4_scan_cfg',{})||{};
const worker=()=>String(cfg().worker||'').trim().replace(/\/+$/,'');
function recs(){const r=LS.get('sv4_records',[]);return Array.isArray(r)?r:[];}
const isAct=r=>r.status==='buy'||r.status==='hold';
const codeIn=s=>{const m=String(s||'').match(/[0-9A-Z]{6}/);return m?m[0]:null;};
function app(){const a=LS.get('sv4_app',{})||{};a.prefs=Object.assign({acct:0,pct:50,stop:15,maxB:2,topn:5,halt:10,testPct:25},a.prefs);a.dec=Object.assign({},a.dec);if(!Array.isArray(a.fav))a.fav=[];if(!Array.isArray(a.claude))a.claude=[];return a;}
function saveApp(a){LS.set('sv4_app',a);}
function nameOf(c){if(!c)return '';if(D&&D.stocks&&D.stocks[c])return D.stocks[c][0];const n=(D&&D.names&&D.names[c]);if(n)return n;const w=watchRow(c);if(w)return w.name;const r=recs().find(x=>codeIn(x.stock)===c);if(r)return String(r.stock).replace(/[0-9A-Z]{6}/,'').replace(/[()]/g,'').trim()||c;return c;}
function watchRow(c){const w=D&&D.watch;if(w)for(const t of w.themes||[])for(const s of t.stocks||[])if(s.code===c)return Object.assign({theme:t.name,tq:t.q},s);
  if(WL)for(const t of WL.themes||[])for(const s of t.stocks||[])if(s.code===c)return Object.assign({theme:t.name},s);return null;}
async function load(){
  const c=LS.get('sv4_v2_cache',null);if(c&&c.kind==='sv4-volume-scan'&&!D){D=c;render();}   // 1) 지난번 결과로 바로 그리기
  try{const r=await fetch(SCAN_URL,{cache:'no-cache'});if(!r.ok)throw new Error('스캔 결과 '+r.status);const js=await r.json();   // 2) 바뀐 게 있을 때만 새로 받음(304)
    if(!js||js.kind!=='sv4-volume-scan')throw new Error('스캔 결과 모양이 달라요');D=js;LOAD_ERR='';setTimeout(()=>LS.set('sv4_v2_cache',slim(js)),0);}
  catch(e){LOAD_ERR=e.message||String(e);}
  if(!D||!D.watch){try{const r=await fetch(LIST_URL,{cache:'no-cache'});if(r.ok)WL=await r.json();}catch(e){}}
}
function slim(d){ // 오프라인용 축약본 (용량 보호: 신호 목록·종목별 뉴스는 뺌)
  const o={kind:d.kind,stocks:d.stocks,generatedAt:d.generatedAt,baseDate:d.baseDate,intraday:d.intraday,themes:d.themes,us:d.us,flows:d.flows,watch:d.watch,reviews:d.reviews,names:d.names,pullbacks:{trigger:(d.pullbacks||{}).trigger||[]},
    news:d.news?{asOf:d.news.asOf,themes:d.news.themes}:null,dart:d.dart,cached:true};
  if(o.themes&&o.themes.ranks)o.themes=Object.assign({},o.themes,{ranks:undefined});return o;}

/* ── 규칙: 묶음 · 손익 · 검증 · 오늘의 결정 (기존 화면과 같은 계산) ── */
function myBaskets(pk,asOf,hold){
  const R=recs(),all=(pk.open||[]).concat(pk.closed||[]);
  return [...new Set(R.filter(r=>r.basket&&isAct(r)).map(r=>r.basket))].sort().map(d=>{
    const rs=R.filter(r=>r.basket===d&&isAct(r)),inv=rs.reduce((x,r)=>x+(r.entry||0)*(r.qty||0),0),val=rs.reduce((x,r)=>x+(r.current||r.entry||0)*(r.qty||0),0);
    const p=all.find(x=>x.date===d);
    return {date:d,days:tdBetween(d,asOf),end:nextTD(d,hold),n:rs.length,inv,val,themes:p?p.themes:[...new Set(rs.map(r=>r.theme).filter(Boolean))]};});
}
function bstate(){
  const tf=D&&D.themes,pk=tf&&tf.picks;if(!pk)return null;
  const a=app(),hold=pk.hold||10,asOf=pk.asOf||tf.date,maxB=a.prefs.maxB||2;
  const my=myBaskets(pk,asOf,hold),live=my.filter(b=>b.days<hold),stale=my.filter(b=>b.days>=hold),soon=live.filter(b=>b.days===hold-1);
  const prop=!pk.rest&&(pk.today||[]).length?{date:asOf,themes:pk.today.map(x=>x.theme)}:null;
  const dec=a.dec[asOf],held=live.some(b=>b.date===asOf),free=maxB-live.filter(b=>b.date!==asOf).length;
  let kind='hold';
  if(stale.length)kind='clear';else if(soon.length)kind='soon';
  if(prop&&!dec&&!held&&kind!=='clear'){if(kind==='hold')kind=free>0?'prop':'full';}
  else if(prop&&(dec||held)&&kind==='hold')kind='done';
  else if(pk.rest&&kind==='hold')kind='rest';
  return {tf,pk,hold,asOf,maxB,my,live,stale,soon,prop,dec,free,kind};
}
function ledger(){
  const a=app(),from=a.prefs.haltFrom||'';let real=0,unr=0,realAll=0,unrAll=0,inv=0,val=0,n=0;
  recs().forEach(r=>{if(!r.basket)return;const act=isAct(r),rp=act?(r.pnlPart||0):(r.pnl||0),sc=!from||(r.date||'')>=from;
    realAll+=rp;if(sc)real+=rp;n++;
    if(act){const c=(r.entry||0)*(r.qty||0),v=(r.current||r.entry||0)*(r.qty||0);inv+=c;val+=v;unrAll+=v-c;if(sc)unr+=v-c;}});
  const acct=a.prefs.acct||0,base=Math.max(acct-real,0),halt=a.prefs.halt||0,pl=real+unr;
  const plPct=base?pl/base*100:null,halted=!!(halt&&base&&plPct<=-halt);
  return {acct,inv,val,real,unr,unrAll,total:realAll+unrAll,base,halt,pl,plPct,halted,n};
}
function verdict(pk){
  const v=(pk&&pk.summary&&pk.summary.vsIdx)||null,n=v?v.n:0;let st='test',say='검증 중';
  if(n>=VER_N){if(v.cur>v.idx&&v.beat>=50){st='pass';say='기준 통과';}else{st='fail';say='기준 미달';}}
  return {v,n,st,say};
}
function decide(){
  const s=bstate();if(!s)return null;
  const L=ledger(),V=verdict(s.pk),pk=s.pk,a=app();let word,text,btns=[],tone='calm';
  const live=s.live.length;
  if(s.kind==='clear'){word='정리하기';tone='warn';text=md(s.stale[0].date)+' 묶음이 10거래일을 채웠어요. 팔았다면 정리 기록을 남기고, 아직이면 다음 거래일에 팔아요.';btns=[{l:'기존 화면에서 정리 기록하기',href:V1}];}

  const get=k=>{const m=t.match(new RegExp(k+'\\s*[:：]\\s*(.+)'));return m?m[1].trim():'';};
  const hd=t.split('\n')[0].replace('[트래커 기록]','').trim();const pk=get('후보'),picks=[];
  if(pk&&!/^없음/.test(pk))pk.split(/\s\/\s|\/(?=\s*[^\d\s])|;/).forEach(s=>{const c=(s.match(/\(([0-9A-Z]{6})\)/)||s.match(/\b([0-9]{6})\b/)||[])[1];if(!c)return;
    const num=k=>{const m=s.match(new RegExp(k+'\\s*([\\d,]+)'));return m?+m[1].replace(/,/g,''):null;};
    picks.push({code:c,name:(s.split('(')[0]||'').trim(),entry:num('진입'),target:num('목표'),stop:num('손절')});});
  return {hd,agree:get('판정').split('|')[0].trim(),concl:get('결론').split('|')[0].trim(),picks,watch:get('감시 조건'),learn:get('배울 점'),mode:(hd.split('·')[1]||'').trim()};}
function copyText(t){
  if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t).then(()=>true,()=>fallback());return Promise.resolve(fallback());
  function fallback(){try{const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);const ok=document.execCommand('copy');ta.remove();return ok;}catch(e){return false;}}}
/* 채점: 10거래일 뒤 — 지수는 저장할 때 KODEX 200 종가와 채점 시점 종가를 비교, 후보는 시세 서버 일봉으로 */
async function scoreAll(){
  const a=app(),bn=D&&D.themes&&D.themes.bench;if(!bn||!a.claude.length)return;let ch=false;
  for(const r of a.claude){if(r.score||!r.b0)continue;const end=nextTD(r.d,10);if(bn.asOf<end)continue;
    const idx=(bn.close/r.b0-1)*100;let rr=null,t='';
    if(r.picks.length){const vals=[];for(const p of r.picks){const R=await rows(p.code,60);if(!R)continue;const i0=R.findIndex(x=>x.d>=r.d),i1=R.findIndex(x=>x.d>=end);if(i0<0||i1<0)continue;vals.push((R[i1].c/R[i0].c-1)*100);}
      if(!vals.length)continue;rr=vals.reduce((x,v)=>x+v,0)/vals.length;t='후보 평균 '+pct(rr)+' vs 지수 '+pct(idx);r.score={ok:rr>idx,t,r:rr,i:idx,at:bn.asOf};}
    else{const ok=/관망|정리/.test(r.concl)?idx<=0:idx>0;t=(/관망|정리/.test(r.concl)?'관망 결론 · 그 뒤 10거래일 지수 ':'후보 없이 매수 검토 · 그 뒤 지수 ')+pct(idx);r.score={ok,t,i:idx,at:bn.asOf};}
    ch=true;}
  if(ch){saveApp(a);if(route().v==='rec')render();}}

/* ── 공용: 시트 · 토스트 ── */
function sheet(html){const L=document.getElementById('layer');L.innerHTML='<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-modal="true">'+html+'<button class="btn s" style="margin-top:16px" data-act="close">닫기</button></div></div>';}
let _tt;function toast(m){clearTimeout(_tt);let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el);}el.textContent=m;el.style.display='block';_tt=setTimeout(()=>{el.style.display='none';},2600);}
function searchSheet(){sheet('<h3>종목 찾기</h3><input type="text" id="q" placeholder="종목명이나 코드" autocomplete="off"><div id="qr" style="margin:8px -20px 0"></div>');
  const q=document.getElementById('q');setTimeout(()=>q.focus(),50);
  q.addEventListener('input',()=>{const v=q.value.trim().replace(/\s/g,'');const out=[];if(v){const all=Object.assign({},D&&D.names);if(D&&D.stocks)Object.keys(D.stocks).forEach(c=>all[c]=D.stocks[c][0]);((D&&D.watch&&D.watch.themes)||(WL&&WL.themes)||[]).forEach(t=>t.stocks.forEach(s=>all[s.code]=s.name));
      Object.keys(all).forEach(c=>{if(out.length<20&&(c.startsWith(v)||String(all[c]).replace(/\s/g,'').includes(v)))out.push(c);});}
    document.getElementById('qr').innerHTML=out.map(c=>'<a class="row" href="#/stock/'+c+'" data-act="close"><span class="grow"><b>'+esc(nameOf(c))+'</b><span class="meta">'+c+'</span></span></a>').join('')||(v?'<div class="empty">트래커가 아는 종목 중에는 없어요. 스캔·관심·공시·뉴스에 나온 종목만 찾을 수 있어요.</div>':'');});}

/* ── 라우터 ── */
function route(){const h=location.hash.replace(/^#\/?/,'')||'home',[p,qs]=h.split('?'),seg=p.split('/'),q={};(qs||'').split('&').forEach(x=>{const [a,b]=x.split('=');if(a)q[a]=decodeURIComponent(b||'');});return {v:seg[0]||'home',arg:seg[1],q};}
function render(){
  const r=route(),el=document.getElementById('app');let h='';
  let openInd=null;if(r.v==='map'&&r.q.ind){UI.map.mode='ind';UI.map.drill=null;UI.map.sel=r.q.ind;openInd=r.q.ind;try{history.replaceState(null,'','#/map');}catch(e){}}
  if(r.v==='watch'&&r.q.tab)UI.watch.tab=r.q.tab;
  if(r.v==='ask'){if(r.q.code&&UI.ask.code!==r.q.code){UI.ask.code=r.q.code;UI.ask.mode='stock';}}
  const tab={home:'home',map:'map',watch:'watch',cal:'cal',rec:'rec'}[r.v]||'';
  try{h=r.v==='map'?vMap():r.v==='watch'?vWatch():r.v==='cal'?vCal():r.v==='rec'?vRec():r.v==='ask'?vAsk():r.v==='stock'&&r.arg?vStock(r.arg):vHome();}
  catch(e){console.error(e);h='<div class="warnbox" style="margin-top:24px">화면을 그리다 문제가 생겼어요: '+esc(e.message)+'. 기존 화면은 그대로 쓸 수 있어요.</div><a class="btn s" style="margin-top:12px" href="'+V1+'">기존 화면으로</a>';}
  el.innerHTML=h;tabs(r.v==='stock'||r.v==='ask'?'':tab||'home');
  if(openInd){const md_=mapData(),it=md_.items.find(x=>x.theme===openInd);if(it)themeSheet(it,md_.ind);}
  if(r.v==='home'||r.v==='')spark();if(r.v==='stock'&&r.arg)stockAsync(r.arg);
}
let _lastHash='';
window.addEventListener('hashchange',()=>{const r=route();if(r.v!==(_lastHash.split('/')[0]||''))window.scrollTo(0,0);_lastHash=r.v;document.getElementById('layer').innerHTML='';render();});
document.addEventListener('click',e=>{
  const th=e.target.closest('[data-th]');if(th){const md_=mapData(),it=md_.items.find(x=>x.theme===th.dataset.th);if(it){UI.map.sel=it.theme;render();themeSheet(it,md_.ind);}return;}
  const pt=e.target.closest('circle[data-i]');if(pt){const md_=mapData(),it=md_.items[+pt.dataset.i];if(it){UI.map.sel=it.theme;render();themeSheet(it,md_.ind);}return;}
  const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,v=b.dataset.v;
  if(act==='close'){if(e.target===b||b.tagName==='BUTTON'||b.tagName==='A'){document.getElementById('layer').innerHTML='';}return;}
  if(b.tagName==='A')return;
  e.preventDefault();
  const S=UI;
  switch(act){
    case 'guide':{const g=GUIDE[b.dataset.k];if(g)sheet('<h3>'+g[0]+'</h3><p class="sub" style="font-size:15px;margin:0">'+g[1]+'</p>');break;}
    case 'why':{const d=decide();if(!d)break;sheet('<h3>왜 '+d.word+'인가요</h3><p class="sub" style="font-size:15px;margin:0 0 12px">'+esc(d.text)+'</p>'+d.ck.map(c=>'<div style="padding:10px 0;border-top:1px solid var(--s2)"><b>'+c.k+' · '+esc(c.say)+'</b><div class="sub num">'+esc(c.v)+'</div><div class="note" style="margin-top:4px">'+GUIDE[c.g][1]+'</div></div>').join(''));break;}
    case 'pass':{const s=bstate();if(!s)break;const a=app();a.dec[s.asOf]='pass';saveApp(a);toast('오늘 제안은 패스로 기록했어요. 기록 탭에서 결과를 비교해요');render();break;}
    case 'unhalt':{const a=app();a.prefs.haltFrom=kst().iso;saveApp(a);toast('멈춤을 풀었어요. 오늘부터 손익을 다시 세요');render();break;}
    case 'search':searchSheet();break;
    case 'mapmode':S.map.mode=v;S.map.sel=null;S.map.more=false;render();break;
    case 'mapview':S.map.view=v;render();break;
    case 'trail':S.map.trail=!S.map.trail;render();break;
    case 'big':S.map.big=!S.map.big;render();break;
    case 'drill':document.getElementById('layer').innerHTML='';S.map.drill=v;S.map.sel=null;S.map.more=false;render();window.scrollTo(0,0);break;
    case 'undrill':S.map.sel=S.map.drill;S.map.drill=null;render();break;
    case 'more':S.map.more=true;render();break;
    case 'memall':MEM.all=true;members();break;
    case 'wtab':S.watch.tab=v;render();break;
    case 'wopen':{const cur=S.watch.open[v];const list=((D&&D.watch&&D.watch.themes)||(WL&&WL.themes)||[]);const idx=list.findIndex(t=>t.id===v);S.watch.open[v]=!(cur!=null?cur:idx===0);render();break;}
    case 'wall':S.watch['all_'+v]=true;render();break;
    case 'fav':{const a=app(),i=a.fav.indexOf(v);if(i>=0)a.fav.splice(i,1);else a.fav.push(v);saveApp(a);toast(i>=0?'관심 종목에서 뺐어요':'관심 종목에 넣었어요');render();break;}
    case 'calf':S.cal.f=v;render();break;
    case 'earn':S.cal.earn=v;render();break;
    case 'amode':S.ask.mode=v;render();break;
    case 'afeed':S.ask.off[v]=!S.ask.off[v];render();break;
    case 'afull':S.ask.full=!S.ask.full;render();break;
    case 'acopy':{const t=buildPrompt();copyText(t).then(ok=>{if(ok)sheet('<h3>질문을 복사했어요</h3><p class="sub" style="font-size:15px;margin:0 0 16px">Claude 새 대화창에 붙여 넣고 보내 주세요. 답 끝의 트래커 기록 블록은 이 화면 아래 칸에 붙여 넣어요.</p><a class="btn" href="https://claude.ai/new" target="_blank" rel="noopener" data-act="close">Claude 열기</a>');else{UI.ask.full=true;render();toast('자동 복사가 안 됐어요. 미리보기 글을 길게 눌러 복사해 주세요');}});break;}
    case 'asave':{const ta=document.getElementById('paste');S.ask.paste=ta?ta.value:'';const p=parseBlock(S.ask.paste);
      if(!p){toast('"[트래커 기록]"으로 시작하는 블록을 찾지 못했어요');break;}
      const a=app(),bn=D&&D.themes&&D.themes.bench,k=kst();p.id=Date.now();p.d=k.iso;p.b0=bn?bn.close:null;p.bAt=bn?bn.asOf:null;a.claude.push(p);if(a.claude.length>200)a.claude=a.claude.slice(-200);saveApp(a);
      S.ask.paste='';toast('기록했어요. '+md(nextTD(k.iso,10))+'에 채점해요');location.hash='#/rec';break;}
    case 'cdel':{const a=app();a.claude=a.claude.filter(r=>String(r.id)!==v);saveApp(a);toast('기록을 지웠어요');render();break;}
  }
});
document.addEventListener('input',e=>{if(e.target.id==='paste')UI.ask.paste=e.target.value;});
(async function(){_lastHash=route().v;await load();render();scoreAll();})();
</script>
