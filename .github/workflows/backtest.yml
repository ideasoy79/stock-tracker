name: backtest
on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 1 * *"
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas lxml
      - name: 백테스트
        env:
          KIS_APPKEY: ${{ secrets.KIS_APPKEY }}
          KIS_APPSECRET: ${{ secrets.KIS_APPSECRET }}
        run: python scan/backtest.py
      - name: 결과 저장
        run: |
          git config user.name "backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase || true
          git add scan/backtest.json
          git diff --cached --quiet && exit 0
          git commit -m "backtest: $(date -u +%F)"
          git push
