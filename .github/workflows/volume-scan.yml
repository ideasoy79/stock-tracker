# 생각콩 × AI 주식 트래커 — 거래량 급증 자동 스캔
# 평일 20:40(KST) 애프터마켓 마감 뒤 실행 → scan/latest.json 갱신 → 트래커가 자동으로 불러옴 → 텔레그램 저녁 요약
name: volume-scan

on:
  schedule:
    - cron: "40 11 * * 1-5"   # UTC 11:40 = KST 20:40, 월~금 (애프터마켓 20:00 마감 뒤)
  workflow_dispatch:          # Actions 탭에서 [Run workflow] 로 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: volume-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install requests pandas lxml

      - name: 테마 구성 갱신 (월요일 또는 처음)
        run: |
          if [ ! -f scan/themes.json ] || [ "$(date -u +%u)" = "1" ]; then python scan/themes.py || echo "테마 갱신 실패 — 기존 파일 사용"; fi
      - name: 전 종목 스캔
        env:   # 저장소 Settings › Secrets and variables › Actions 에 등록 (없으면 네이버 시세로 자동 대체)
          KIS_APPKEY: ${{ secrets.KIS_APPKEY }}
          KIS_APPSECRET: ${{ secrets.KIS_APPSECRET }}
        run: python scan/volume_scan.py

      - name: 결과 저장(커밋)
        run: |
          git config user.name  "tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scan/latest.json
          if [ -f scan/themes.json ]; then git add scan/themes.json; fi
          if [ -f scan/theme_picks.json ]; then git add scan/theme_picks.json; fi
          if [ -f scan/review_state.json ]; then git add scan/review_state.json; fi
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "scan: $(date -u +%F) 거래량 급증 스캔"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "push 재시도 $i"; sleep 5
          done
          exit 1

      - name: 텔레그램 저녁 요약 (봇 토큰이 없으면 건너뜀)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "봇 토큰 없음 → 건너뜀"; exit 0; fi
          pip install -q firebase-admin || true
          python scan/notify.py evening || echo "알림 실패(스캔 결과에는 영향 없음)"
